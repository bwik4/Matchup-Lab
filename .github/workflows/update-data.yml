name: Update NFL data

on:
  schedule:
    # Every day at 13:30 UTC (7:30am Central in winter, 8:30am in summer)
    - cron: "30 13 * * *"
  workflow_dispatch:
    inputs:
      force_props:
        description: "Pull sportsbook props now (uses Odds API credits)"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pandas
      - run: python pipeline.py --out data
      - name: Sportsbook props (only runs once the ODDS_API_KEY secret is set)
        run: python props.py --out data ${{ inputs.force_props && '--force' || '' }}
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
      - name: Commit new data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "Weekly NFL data refresh"
          git push
